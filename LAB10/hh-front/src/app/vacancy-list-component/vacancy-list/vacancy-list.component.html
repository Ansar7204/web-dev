<h2>All Vacancies</h2>
<ul>
  <li *ngFor="let v of vacancies">
    {{ v.name }} - ${{ v.salary }}
    <span *ngIf="v.company && companyName(v.company)">
      ({{ companyName(v.company) }})
    </span>
  </li>
</ul>

<h3>Top 10 Vacancies</h3>
<ul>
  <li *ngFor="let v of topVacancies">
    {{ v.name }} - ${{ v.salary }}
    <span *ngIf="v.company && companyName(v.company)">
      ({{ companyName(v.company) }})
    </span>
  </li>
</ul>

<h3>Add New Vacancy</h3>
<form (ngSubmit)="addVacancy()">
  <input [(ngModel)]="newVacancy.name" name="name" placeholder="Name" required />
  <input [(ngModel)]="newVacancy.description" name="description" placeholder="Description" required />
  <input [(ngModel)]="newVacancy.salary" name="salary" type="number" placeholder="Salary" required />

  <select [(ngModel)]="newVacancy.company" name="company" required>
    <option *ngFor="let company of companies" [value]="company.id">
      {{ company.name }} - {{ company.city }}
    </option>
  </select>

  <button type="submit">Add Vacancy</button>
</form>
